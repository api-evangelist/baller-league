name: Baller League
description: 'Baller League is a small-sided (six-a-side) football entertainment
  league and media format founded in Germany that bills itself as "a new era of
  football, created for the streets by the streets." Teams are captained by
  professional footballers, influencers, and streamers, with matches played under
  a fast-paced ruleset and distributed primarily through live streaming and social
  video (Twitch, YouTube, TikTok, Instagram) rather than traditional broadcast. The
  organization has expanded from Germany into the United Kingdom and United States
  and is running its fourth season. It is a consumer sports-media and entertainment
  brand; as of this profile it publishes no public developer API, documentation, or
  developer program. Backed by EQT Ventures and tracked in the API Evangelist
  network as a portfolio company.'
